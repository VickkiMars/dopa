# ==============================================================================
# Render Infrastructure-as-Code Blueprint for DOPA Clinical Platform
# Architecture: Web Service (Python 3.12 / Gunicorn) + Managed PostgreSQL (Supabase/Render)
# Reference: dopa_requirement_analysis.md (§2.2, §3.1)
# ==============================================================================

services:
  - type: web
    name: dopa-clinical
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn dopa_project.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --threads 2 --timeout 120
    healthCheckPath: /health/
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_SETTINGS_MODULE
        value: dopa_project.settings
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: DATABASE_URL
        sync: false # Insert Supabase PostgreSQL connection URI in Render Dashboard
      - key: DB_SSL_REQUIRE
        value: "True"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
