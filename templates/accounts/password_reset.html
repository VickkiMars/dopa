{% extends 'base.html' %}

{% block title %}Reset Password — DOPA Platform{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="card border shadow-none rounded-1">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-1 mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
                        <i class="bi bi-key"></i>
                    </div>
                    <h1 class="h4 fw-bold text-dark mb-1">Reset Password</h1>
                    <p class="text-muted small mb-0">Enter your registered email address to receive password recovery instructions</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label for="id_email" class="form-label small fw-bold text-muted">Professional Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted rounded-start-1">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="email" name="email" id="id_email" required class="form-control border-start-0 rounded-end-1" placeholder="clinician@hospital.org">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 rounded-1 py-2 fw-semibold">
                        <i class="bi bi-send me-1"></i> Send Reset Link
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <a href="{% url 'accounts:login' %}" class="btn btn-link btn-sm text-secondary text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i> Return to Sign In
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
