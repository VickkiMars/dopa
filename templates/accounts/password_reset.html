{% extends 'base.html' %}

{% block title %}Reset Password — DOPA{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
    <div class="card">
        <h1 style="font-size: 1.375rem; font-weight: 700; margin-bottom: 0.5rem;">Reset Password</h1>
        <p style="font-size: 0.875rem; color: var(--color-text-sub); margin-bottom: 1.5rem;">
            Enter your registered email address to receive password recovery instructions.
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_email" class="form-label">Professional Email</label>
                <input type="email" name="email" id="id_email" required class="form-input" placeholder="clinician@hospital.org">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; height: 42px;">
                Send Reset Link
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem;">
            <a href="{% url 'accounts:login' %}" class="btn-link">Return to Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
