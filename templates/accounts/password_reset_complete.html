{% extends 'base.html' %}

{% block title %}Password Reset Complete — DOPA{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
    <div class="card" style="text-align: center;">
        <div style="font-size: 2.5rem; margin-bottom: 1rem; color: var(--color-success);">✓</div>
        <h1 style="font-size: 1.375rem; font-weight: 700; margin-bottom: 0.5rem;">Password Updated</h1>
        <p style="font-size: 0.875rem; color: var(--color-text-sub); margin-bottom: 1.5rem;">
            Your password has been successfully reset. You can now sign in with your new credentials.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary" style="width: 100%;">Sign In Now</a>
    </div>
</div>
{% endblock %}
