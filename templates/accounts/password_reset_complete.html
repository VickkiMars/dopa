{% extends 'base.html' %}

{% block title %}Password Reset Complete — DOPA Platform{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="card border shadow-none rounded-1 text-center">
            <div class="card-body p-4 p-md-5">
                <div class="d-inline-flex align-items-center justify-content-center bg-success text-white rounded-1 mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
                    <i class="bi bi-check-lg"></i>
                </div>
                <h1 class="h4 fw-bold text-dark mb-2">Password Updated</h1>
                <p class="text-muted small mb-4">
                    Your password has been successfully reset. You can now authenticate with your updated credentials.
                </p>
                <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100 rounded-1 py-2 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In Now
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
