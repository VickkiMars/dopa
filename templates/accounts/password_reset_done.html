{% extends 'base.html' %}

{% block title %}Reset Instructions Dispatched — DOPA{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 3rem auto;">
    <div class="card" style="text-align: center;">
        <div style="font-size: 2.5rem; margin-bottom: 1rem;">✉️</div>
        <h1 style="font-size: 1.375rem; font-weight: 700; margin-bottom: 0.5rem;">Check Your Email</h1>
        <p style="font-size: 0.875rem; color: var(--color-text-sub); margin-bottom: 1.5rem;">
            If the email you entered exists in our clinician registry, we have sent instructions to reset your password.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-secondary">Return to Sign In</a>
    </div>
</div>
{% endblock %}
